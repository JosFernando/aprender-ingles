name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x gradlew

      - name: Accept Licenses and Install SDK 35
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-license
          echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Locate and Collect APKs
        run: |
          echo "=== SEARCHING FOR ALL APKS ==="
          mkdir -p apks
          find . -name "*.apk"
          find . -name "*.apk" -exec cp -v {} apks/ \;
          echo "=== APKS COLLECTED ==="
          ls -lh apks/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Ingles-Gramatica-Android-APK
          path: apks/*.apk

  build-ios:
    name: Build iOS (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS No-CodeSign
        working-directory: ./ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload iOS App Project
        uses: actions/upload-artifact@v4
        with:
          name: Ingles-Gramatica-iOS-Project
          path: ios/App/
